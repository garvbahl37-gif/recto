services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_storage:/qdrant/storage"]

  insightledger:
    build: .
    ports: ["8000:8000"]
    environment:
      # flip these on once you install the real backends / add a key:
      # IL_VECTOR_STORE: qdrant
      # QDRANT_URL: http://qdrant:6333
      # IL_LLM: claude
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      IL_EDGAR_USER_AGENT: "Recto research you@example.com"
    depends_on: [qdrant]

volumes:
  qdrant_storage:
